<!-- Everything inside <head>. Edit this file to change metadata for every page at once. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>
  {% if page.title and page.title != site.title %}{{ page.title }} &middot; {{ site.title }}{% else %}{{ site.title }}{% endif %}
</title>

{% if page.description %}<meta name="description" content="{{ page.description }}" />{% endif %}

<!--
  The tab icon: the site's initial in Vollkorn, drawn as a path so it does not
  depend on the font loading. One svg covers every current browser; the png is
  for iOS home screens, which do not take svg.
-->
<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml" />
<link rel="apple-touch-icon" href="{{ '/assets/img/apple-touch-icon.png' | relative_url }}" />

<!--
  The body font is referenced from main.css, which the browser only reads
  after fetching it. Preloading starts the font download in parallel instead,
  which shortens the moment where text renders in the fallback serif.
-->
<link rel="preload" href="{{ '/assets/fonts/vollkorn-variable.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin />

<!-- Tells search engines which URL is the real one for this page. -->
<link rel="canonical" href="{{ page.url | absolute_url }}" />

<!--
  The `?v=` is the site's build time. Without it browsers happily serve a
  cached stylesheet after a rebuild, which during development means every
  change appears not to have worked until a hard reload.
-->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}" />

<!--
  MathJax renders the LaTeX in posts.

  Every post loads it, so math in a post can never silently fail to render.
  Other pages have to ask for it with `math: true` in their front matter --
  the library is about a megabyte, and even served from cache it costs a
  ~90ms main-thread stall while it parses and runs its startup sweep, which
  is visible as a stutter in anything animating on the page.

  The inlineMath line is required: kramdown converts $$...$$ display math into
  \[...\] (which MathJax reads by default) but passes single-$ inline math
  through untouched, so MathJax has to be told to look for it.
-->
{% if page.layout == 'post' or page.math %}
  <script>
    window.MathJax = { tex: { inlineMath: [["$", "$"]] } };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
{% endif %}
