<!--
  Site header, shown on every page.

  To add a page to the nav, add one <a> line below and create the matching
  page file (see AGENTS.md). The links are written out by hand rather than
  generated from a list, so that adding one is a single obvious edit.
-->
<header class="site-header">
  <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="{{ '/posts/' | relative_url }}">Posts</a>
  </nav>
</header>
