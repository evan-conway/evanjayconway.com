# Books read, newest year first, and newest first within a year.
#
# Adding one is a title, an author and the month. No ratings or notes on
# purpose: a log that asks nothing of you when you finish a book is one you
# will keep. Years group the entries so the page reads as a record rather than
# a feed, and does not look stalled when a month goes by without an entry.

- year: 2026
  books:
    - title: "Through the Eye of a Needle: Wealth, the Fall of Rome, and the Making of Christianity in the West, 350–550 AD"
      author: Peter Brown
      month: August
    - title: Between Two Fires
      author: Christopher Buehlman
      month: August
    - title: Seven Surrenders
      author: Ada Palmer
      month: August
    - title: Too Like the Lightning
      author: Ada Palmer
      month: August
