services:
  jekyll:
    image: ruby:3.3
    working_dir: /site
    command: bash -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --port 8080 --livereload --force_polling"
    ports:
      - "8080:8080"
      - "35729:35729"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle

volumes:
  bundle:
