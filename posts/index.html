<!doctype html>
<!--
  The base layout every page ends up inside.

  The other two layouts (page.html and post.html) wrap a page's content and
  then hand it to this one, which supplies the surrounding HTML document.

  Note: Liquid runs inside HTML comments too, so don't write Liquid tags in a
  comment unless you mean them to execute. The doctype stays on line 1.
-->
<html lang="en">
  <head>
    <!-- Everything inside <head>. Edit this file to change metadata for every page at once. -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>
  Writing &middot; Evan Conway
</title>



<!--
  The tab icon: the site's initial in Vollkorn, drawn as a path so it does not
  depend on the font loading. One svg covers every current browser; the png is
  for iOS home screens, which do not take svg.
-->
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png" />

<!--
  The body font is referenced from main.css, which the browser only reads
  after fetching it. Preloading starts the font download in parallel instead,
  which shortens the moment where text renders in the fallback serif.
-->
<link rel="preload" href="/assets/fonts/vollkorn-variable.woff2" as="font" type="font/woff2" crossorigin />

<!-- Tells search engines which URL is the real one for this page. -->
<link rel="canonical" href="https://evanjayconway.com/posts/" />

<!--
  The `?v=` is the site's build time. Without it browsers happily serve a
  cached stylesheet after a rebuild, which during development means every
  change appears not to have worked until a hard reload.
-->
<link rel="stylesheet" href="/assets/css/main.css?v=1787104677" />

<!--
  MathJax renders the LaTeX in posts.

  Every post loads it, so math in a post can never silently fail to render.
  Other pages have to ask for it with `math: true` in their front matter --
  the library is about a megabyte, and even served from cache it costs a
  ~90ms main-thread stall while it parses and runs its startup sweep, which
  is visible as a stutter in anything animating on the page.

  The inlineMath line is required: kramdown converts $$...$$ display math into
  \[...\] (which MathJax reads by default) but passes single-$ inline math
  through untouched, so MathJax has to be told to look for it.
-->


  </head>
  <body>
    <!--
  Site header, shown on every page.

  To add a page to the nav, add one <a> line below and create the matching
  page file (see AGENTS.md). The links are written out by hand rather than
  generated from a list, so that adding one is a single obvious edit.
-->
<header class="site-header">
    <a href="/">Evan Conway</a>
  
  <nav>
    <a href="/reading/">Reading</a> ·
    <a href="/posts/">Writing</a>
  </nav>
</header>


    <main>
      <!-- A standalone page: the title from the front matter, then the page's content. -->
<article>
  <h1>Writing</h1>

  <!--
  Lists every file in _posts/, newest first. New posts appear here
  automatically; there is no list to keep updated.
-->
<ul class="post-list">
  
    <li>
      <time datetime="2026-03-07T00:00:00+00:00">March 7, 2026</time>
      <a href="/posts/2026/nanogpt-improvements/">A Field Guide to NanoGPT Speedrun Optimizations</a>
    </li>
  
</ul>

</article>

    </main>

    <!-- Site footer, shown on every page. -->
<footer class="site-footer">
  <p>&copy; 2026 Evan Conway</p>
</footer>

  </body>
</html>
