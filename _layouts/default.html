<!doctype html>
<!--
  The base layout every page ends up inside.

  The other two layouts (page.html and post.html) wrap a page's content and
  then hand it to this one, which supplies the surrounding HTML document.

  Note: Liquid runs inside HTML comments too, so don't write Liquid tags in a
  comment unless you mean them to execute. The doctype stays on line 1.
-->
<html lang="en">
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include header.html %}

    <main>
      {{ content }}
    </main>

    {% include footer.html %}
  </body>
</html>
