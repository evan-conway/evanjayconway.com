---
layout: default
---

<!-- A blog post: title, date, optional description, then the post body. -->
<article>
  <h1>{{ page.title }}</h1>

  <p class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>

  {% if page.description %}<p class="post-description">{{ page.description }}</p>{% endif %}

  {{ content }}
</article>
