---
layout: default
---

<!--
  A blog post: title, date, then the body.

  The front matter's `description` is deliberately not shown on the page -- it
  feeds the <meta name="description"> tag in head.html instead.
-->
<article>
  <h1>{{ page.title }}</h1>

  <p class="post-date">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
  </p>

  {{ content }}
</article>
